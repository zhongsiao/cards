<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>市井生存圖鑑｜對談指針</title>
  <style>
    :root {
      --bg-color: #F7F5F0;
      --card-bg: #FFFFFF;
      --card-border: #E5E0D8;
      --text-main: #2A2A2A;
      --text-muted: #7A756D;
      --accent: #B85D43;
      --accent-soft: #F4EBE7;
      --discard-color: #8C827A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Serif TC", "Microsoft JhengHei", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .screen {
      display: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      width: 100%;
    }

    .screen.active {
      display: block;
      opacity: 1;
    }

    /* 頂部輕標題 */
    .header-tag {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .header-title {
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-main);
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    /* 卡牌網格 (第一階段：六選二) */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .choice-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90px;
    }

    .choice-card.selected {
      border-color: var(--accent);
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(184, 93, 67, 0.12);
    }

    /* 按鈕共用樣式 */
    .btn {
      width: 100%;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 30px;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(184, 93, 67, 0.25);
      margin-top: 12px;
    }

    .btn:disabled {
      background: var(--card-border);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    /* 第二階段：故事開始與大字顯示 */
    .story-focus-wrap {
      text-align: center;
      padding: 40px 16px;
    }

    .story-meta-label {
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .story-big-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .story-card-display {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-main);
      padding: 16px 20px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .story-recording-hint {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    /* 第三階段：五選二留一捨 */
    .tradeoff-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      flex: 1;
      min-width: 90px;
      background: transparent;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--text-main);
      color: #FFFFFF;
      border-color: var(--text-main);
    }

    .tradeoff-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tradeoff-item {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tradeoff-item .tag {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
      background: #F0EDE8;
      color: var(--text-muted);
    }

    .tradeoff-item.keep {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .tradeoff-item.keep .tag {
      background: var(--accent);
      color: #FFFFFF;
    }

    .tradeoff-item.discard {
      border-color: var(--discard-color);
      background: #EFECE8;
      opacity: 0.85;
    }
    .tradeoff-item.discard .tag {
      background: var(--discard-color);
      color: #FFFFFF;
    }

    /* 第四階段：祈願與祝福收尾 */
    .blessing-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .blessing-title {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      letter-spacing: 0.1em;
    }

    .summary-group {
      margin-bottom: 20px;
      text-align: left;
      border-bottom: 1px dashed var(--card-border);
      padding-bottom: 16px;
    }

    .summary-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .prayer-text {
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--accent);
      line-height: 1.8;
      margin-top: 24px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 第一階段：六維命運盤 (選 2 張) -->
    <div id="screen-step1" class="screen active">
      <div class="header-tag">市井對談・序幕</div>
      <div class="header-title">閉上眼深呼吸，直覺翻開兩張牌</div>
      
      <div class="card-grid" id="grid-stage1">
        <div class="choice-card" onclick="toggleStage1(this, '過去')">過去</div>
        <div class="choice-card" onclick="toggleStage1(this, '現在')">現在</div>
        <div class="choice-card" onclick="toggleStage1(this, '未來')">未來</div>
        <div class="choice-card" onclick="toggleStage1(this, '最滿意的事')">最滿意的事</div>
        <div class="choice-card" onclick="toggleStage1(this, '最大的困難')">最大的困難</div>
        <div class="choice-card" onclick="toggleStage1(this, '最想做的事')">最想做的事</div>
      </div>

      <button id="btn-start-story" class="btn" disabled onclick="goToStoryScreen()">開牌・故事開始</button>
    </div>

    <!-- 第二階段：大字開展與錄音進行中 -->
    <div id="screen-step2" class="screen">
      <div class="story-focus-wrap">
        <div class="story-meta-label">✦ 故事開始・傾聽中 ✦</div>
        
        <div class="story-big-cards">
          <div class="story-card-display" id="display-card-1">牌面一</div>
          <div class="story-card-display" id="display-card-2">牌面二</div>
        </div>

        <div class="story-recording-hint">
          （ 此刻已開啟手機錄音，請像朋友般專注傾聽 ）
        </div>

        <button class="btn" onclick="goToTradeoffScreen()">故事結束・整理行囊</button>
      </div>
    </div>

    <!-- 第三階段：人生行囊（二留一捨） -->
    <div id="screen-step3" class="screen">
      <div class="header-tag">尾聲交割・斷捨離</div>
      <div class="header-title">行囊有限：選 2 樣帶走，丟 1 樣在原地</div>

      <!-- 套組切換選單 -->
      <div class="tradeoff-tabs">
        <button class="tab-btn active" onclick="switchSet('A', this)">生活與體制</button>
        <button class="tab-btn" onclick="switchSet('B', this)">邊界與防禦</button>
        <button class="tab-btn" onclick="switchSet('C', this)">草根與商道</button>
        <button class="tab-btn" onclick="switchSet('D', this)">認同與時區</button>
      </div>

      <div class="tradeoff-list" id="tradeoff-list-container">
        <!-- 動態渲染 5 張牌 -->
      </div>

      <button id="btn-confirm-tradeoff" class="btn" disabled onclick="goToBlessingScreen()">確認行囊・交付祝福</button>
    </div>

    <!-- 第四階段：祈願與禱告收尾 -->
    <div id="screen-step4" class="screen">
      <div class="header-tag">前行・微光銘記</div>
      
      <div class="blessing-box">
        <div class="blessing-title">✦ 人生行囊已就緒 ✦</div>

        <div class="summary-group">
          <div class="summary-label">放進行囊帶走的底牌：</div>
          <div class="summary-value" id="summary-keep">——</div>
        </div>

        <div class="summary-group">
          <div class="summary-label">發誓留在桌上的包袱：</div>
          <div class="summary-value" style="color: var(--discard-color);" id="summary-discard">——</div>
        </div>

        <div class="prayer-text" id="prayer-content">
          願你帶走的籌碼，足以支撐你跨出下一步的踏實；<br>
          願你親手丟下的包袱，不再折磨明天醒來的清晨。
        </div>
      </div>

      <button class="btn" onclick="resetFlow()">完成訪談・開始新旅程</button>
    </div>

  </div>

  <script>
    // 狀態存儲
    let stage1Selected = [];
    let currentSetKey = 'A';
    let keptCards = [];
    let discardedCard = null;

    // 四套副卡資料庫
    const cardSets = {
      'A': [
        '固定體制發放的安全感',
        '人生時鐘的絕對支配權',
        '被主流認可的體面光環',
        '不被打擾的平靜孤獨',
        '害怕落後同儕的焦慮'
      ],
      'B': [
        '討好迎合大眾的習慣',
        '防禦性的刺蝟外殼',
        '像孩童般破冰的勇氣',
        '客套不走心的表面和諧',
        '隨時轉身離開的退場自由'
      ],
      'C': [
        '虛榮的單筆高毛利',
        '薄利多銷的剛需周轉',
        '凡事親力親為的執念',
        '放下面子承擔拒絕的狼狽',
        '替夥伴分擔風險的魄力'
      ],
      'D': [
        '當年風光的沉沒光環',
        '對體能衰退失控的恐懼',
        '後半場扳回一城的執念',
        '接納自身平庸的釋懷',
        '留給身邊人的微光記憶'
      ]
    };

    // 第一階段：選兩張
    function toggleStage1(element, cardName) {
      if (element.classList.contains('selected')) {
        element.classList.remove('selected');
        stage1Selected = stage1Selected.filter(c => c !== cardName);
      } else {
        if (stage1Selected.length < 2) {
          element.classList.add('selected');
          stage1Selected.push(cardName);
        }
      }
      document.getElementById('btn-start-story').disabled = (stage1Selected.length !== 2);
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      window.scrollTo(0, 0);
    }

    // 第二階段：大字過渡
    function goToStoryScreen() {
      document.getElementById('display-card-1').innerText = stage1Selected[0];
      document.getElementById('display-card-2').innerText = stage1Selected[1];
      showScreen('screen-step2');
    }

    // 第三階段：切換至二留一捨
    function goToTradeoffScreen() {
      renderTradeoffCards();
      showScreen('screen-step3');
    }

    function switchSet(key, btn) {
      currentSetKey = key;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      keptCards = [];
      discardedCard = null;
      renderTradeoffCards();
      updateTradeoffBtn();
    }

    function renderTradeoffCards() {
      const container = document.getElementById('tradeoff-list-container');
      container.innerHTML = '';
      const cards = cardSets[currentSetKey];

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'tradeoff-item';
        div.onclick = () => handleTradeoffClick(card, div);

        let tagText = '點擊選擇';
        if (keptCards.includes(card)) {
          div.classList.add('keep');
          tagText = '帶走 (留)';
        } else if (discardedCard === card) {
          div.classList.add('discard');
          tagText = '丟在原地 (捨)';
        }

        div.innerHTML = `
          <span>${card}</span>
          <span class="tag">${tagText}</span>
        `;
        container.appendChild(div);
      });
    }

    // 點擊卡片循環切換狀態：未選 -> 留 (帶走) -> 捨 (丟棄) -> 取消
    function handleTradeoffClick(card, element) {
      if (keptCards.includes(card)) {
        // 從留轉為捨
        keptCards = keptCards.filter(c => c !== card);
        if (!discardedCard) {
          discardedCard = card;
        }
      } else if (discardedCard === card) {
        // 取消選擇
        discardedCard = null;
      } else {
        // 未選狀態時嘗試加入
        if (keptCards.length < 2) {
          keptCards.push(card);
        } else if (!discardedCard) {
          discardedCard = card;
        }
      }
      renderTradeoffCards();
      updateTradeoffBtn();
    }

    function updateTradeoffBtn() {
      const btn = document.getElementById('btn-confirm-tradeoff');
      btn.disabled = !(keptCards.length === 2 && discardedCard !== null);
    }

    // 第四階段：祈願收尾
    function goToBlessingScreen() {
      document.getElementById('summary-keep').innerText = keptCards.join('、');
      document.getElementById('summary-discard').innerText = discardedCard;

      // 依丟棄的卡牌微調祈願文案
      const prayerElem = document.getElementById('prayer-content');
      prayerElem.innerHTML = `
        願你裝入行囊的<strong>「${keptCards[0]}」</strong>與<strong>「${keptCards[1]}」</strong>，化為你往後踏實前行的底氣；<br><br>
        願你今天留在這張桌上的<strong>「${discardedCard}」</strong>，不再沉重地壓在明天醒來的時鐘裡。
      `;

      showScreen('screen-step4');
    }

    // 重置全部流程
    function resetFlow() {
      stage1Selected = [];
      keptCards = [];
      discardedCard = null;
      document.querySelectorAll('#grid-stage1 .choice-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-start-story').disabled = true;
      showScreen('screen-step1');
    }
  </script>
</body>
</html>
