<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>局內人圖鑑｜生命坐標與行囊交割儀</title>
  <style>
    :root {
      --bg-color: #F7F5F0;
      --card-bg: #FFFFFF;
      --card-border: #E2DDD5;
      --text-main: #2A2A2A;
      --text-muted: #7A756D;
      --accent: #B85D43;
      --accent-soft: #F4EBE7;
      --discard-color: #6E6762;
      --staging-bg: #ECE7E0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* 動態視窗高度，徹底杜絕滑動 */
      max-height: 100dvh;
      overflow: hidden; /* 強制消除滾動條 */
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Serif TC", "Microsoft JhengHei", serif;
      line-height: 1.35;
    }

    .container {
      width: 100%;
      max-width: 440px;
      height: 100%;
      margin: 0 auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      height: 100%;
      width: 100%;
      flex-direction: column;
      justify-content: space-between;
    }

    .screen.active {
      display: flex;
    }

    /* 頂部標頭 */
    .header-box {
      text-align: center;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .header-tag {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .header-title {
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.03em;
      margin-top: 1px;
    }

    /* 按鈕共用 */
    .btn {
      width: 100%;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 26px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(184, 93, 67, 0.2);
    }

    .btn:disabled {
      background: #D8D2C9;
      color: #8C857B;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* 第一階段 */
    .stage1-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      flex: 1;
    }

    .section-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .card-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .choice-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 2px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .choice-card.selected {
      border-color: var(--accent);
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    /* 第二階段 */
    .stage2-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
      text-align: center;
      gap: 14px;
    }

    .story-big-box {
      width: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    .story-big-box .label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .story-big-box .val {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* 第三階段：全緊湊一屏核心佈局 */
    .stage3-main {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      overflow: hidden;
      margin-bottom: 6px;
    }

    /* 五大分類單行 5 欄網格 */
    .category-row-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .category-tab {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 1px;
      font-size: 0.74rem;
      color: var(--text-muted);
      text-align: center;
      cursor: pointer;
      line-height: 1.2;
    }

    .category-tab.active {
      background: var(--text-main);
      color: #FFFFFF;
      border-color: var(--text-main);
      font-weight: 600;
    }

    /* 當前分類 5 張牌緊緻清單 */
    .pool-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .pool-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.86rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      min-height: 38px;
    }

    .pool-card.staged {
      background: #E8E3DC;
      border-color: #CCC4BA;
      color: var(--text-muted);
    }

    .pool-card .action-tag {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-soft);
      white-space: nowrap;
      margin-left: 6px;
    }

    .pool-card.staged .action-tag {
      background: #DDD7CE;
      color: #7A756D;
    }

    /* 緊湊型膠囊候選盤 (Staging Dock) */
    .staging-box {
      background: var(--staging-bg);
      border: 1.2px dashed #C8C0B4;
      border-radius: 10px;
      padding: 6px 8px;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .staging-header-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .staging-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 48px;
      align-items: flex-start;
      align-content: flex-start;
    }

    .chip-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.73rem;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .chip-item.keep {
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
      color: var(--accent);
    }

    .chip-item.discard {
      border-color: var(--discard-color);
      background: #DFDAD3;
      color: var(--discard-color);
      font-weight: 600;
    }

    .chip-badge {
      font-size: 0.65rem;
      padding: 1px 4px;
      border-radius: 4px;
      background: #EAE6DE;
      color: var(--text-muted);
    }

    .chip-item.keep .chip-badge {
      background: var(--accent);
      color: #FFFFFF;
    }

    .chip-item.discard .chip-badge {
      background: var(--discard-color);
      color: #FFFFFF;
    }

    /* 第四階段 */
    .stage4-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 20px 14px;
      margin-bottom: 10px;
      text-align: center;
    }

    .summary-text-row {
      text-align: left;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--card-border);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 第一階段：上下分流 -->
    <div id="screen-step1" class="screen active">
      <div class="header-box">
        <div class="header-tag">生命坐標・序幕</div>
        <div class="header-title">上下兩組各翻開一張牌</div>
      </div>

      <div class="stage1-body">
        <div>
          <div class="section-label">✦ 橫軸：時空維度（擇一）</div>
          <div class="card-row" id="row-top">
            <div class="choice-card" onclick="selectTop(this, '過去')">過去</div>
            <div class="choice-card" onclick="selectTop(this, '現在')">現在</div>
            <div class="choice-card" onclick="selectTop(this, '未來')">未來</div>
          </div>
        </div>

        <div>
          <div class="section-label">✦ 縱軸：心性焦點（擇一）</div>
          <div class="card-row" id="row-bottom">
            <div class="choice-card" onclick="selectBottom(this, '最滿意的事')">最滿意的事</div>
            <div class="choice-card" onclick="selectBottom(this, '最大的困難')">最大的困難</div>
            <div class="choice-card" onclick="selectBottom(this, '最想做的事')">最想做的事</div>
          </div>
        </div>
      </div>

      <button id="btn-start-story" class="btn" disabled onclick="goToStoryScreen()">開牌・故事開始</button>
    </div>

    <!-- 第二階段：大字看板 -->
    <div id="screen-step2" class="screen">
      <div class="header-box">
        <div class="header-tag">✦ 故事傾聽中 ✦</div>
        <div class="header-title">專注當下的生命敘事</div>
      </div>

      <div class="stage2-body">
        <div class="story-big-box">
          <div class="label">當前時空</div>
          <div class="val" id="display-top-card">——</div>
        </div>
        <div class="story-big-box">
          <div class="label">核心試煉</div>
          <div class="val" id="display-bottom-card">——</div>
        </div>
        <div style="font-size:0.82rem; color:var(--text-muted);">
          （ 獨立錄音進行中，保持眼神交流與純粹傾聽 ）
        </div>
      </div>

      <button class="btn" onclick="goToTradeoffScreen()">故事結束・整理行囊</button>
    </div>

    <!-- 第三階段：單屏零滾動交割面板 -->
    <div id="screen-step3" class="screen">
      <div class="header-box">
        <div class="header-tag">尾聲交割・斷捨離</div>
        <div class="header-title">選 4–6 張入盤，再做二留一捨</div>
      </div>

      <div class="stage3-main">
        <!-- 5大分類單行全展開 -->
        <div class="category-row-grid">
          <div class="category-tab active" onclick="switchCategory('A', this)">自主動機</div>
          <div class="category-tab" onclick="switchCategory('B', this)">面具防衛</div>
          <div class="category-tab" onclick="switchCategory('C', this)">邊界課題</div>
          <div class="category-tab" onclick="switchCategory('D', this)">損失權衡</div>
          <div class="category-tab" onclick="switchCategory('E', this)">存在意義</div>
        </div>

        <!-- 5張副卡緊緻列出 (零內部滑動) -->
        <div class="pool-list" id="pool-container"></div>

        <!-- 候選盤膠囊托盤 -->
        <div class="staging-box">
          <div class="staging-header-row">
            <span>🎒 行囊盤（點擊卡片切換：留 / 捨）</span>
            <span id="staging-counter" style="color:var(--accent);">0 / 4-6 張</span>
          </div>
          <div class="staging-chips" id="staging-container">
            <div style="font-size:0.75rem; color:var(--text-muted); padding:4px;">
              由上方挑選 4–6 張有共鳴的牌放入
            </div>
          </div>
        </div>
      </div>

      <button id="btn-confirm-tradeoff" class="btn" disabled onclick="goToBlessingScreen()">確認行囊・交付祝福</button>
    </div>

    <!-- 第四階段：客觀祈願收尾 -->
    <div id="screen-step4" class="screen">
      <div class="header-box">
        <div class="header-tag">前行・銘刻</div>
        <div class="header-title">✦ 人生行囊交割完成 ✦</div>
      </div>

      <div class="stage4-body">
        <div class="summary-text-row">
          <div style="font-size:0.78rem; color:var(--text-muted);">收進行囊帶走（留）：</div>
          <div style="font-weight:600; color:var(--text-main);" id="summary-keep">——</div>
        </div>
        <div class="summary-text-row">
          <div style="font-size:0.78rem; color:var(--text-muted);">留在桌上不帶走（捨）：</div>
          <div style="font-weight:600; color:var(--discard-color);" id="summary-discard">——</div>
        </div>
        <div style="font-size:0.95rem; color:var(--accent); line-height:1.7; margin-top:10px;" id="prayer-content"></div>
      </div>

      <button class="btn" onclick="resetFlow()">完成訪談・重置體驗</button>
    </div>

  </div>

  <script>
    let selectedTopCard = null;
    let selectedBottomCard = null;
    let currentCategory = 'A';
    let stagedItems = [];

    // 五大心理學卡牌資料庫
    const cardDatabase = {
      'A': [
        '掌控生活節奏的自主權',
        '證明自身價值的勝任感',
        '被群體接納的安全歸屬',
        '滿足外界期待的責任包袱',
        '不敢落後同儕的競爭焦慮'
      ],
      'B': [
        '滴水不漏的體面面具',
        '害怕受傷害的防禦疏離',
        '承認脆弱與不完美的勇氣',
        '討好順從的習慣性妥協',
        '不背負承諾的退場自由'
      ],
      'C': [
        '不怕被否定的被討厭勇氣',
        '渴望所有人認同的證明欲',
        '扛下身邊人情緒的過度介入',
        '劃清界限的平靜冷酷',
        '凡事只能靠自己的假性自立'
      ],
      'D': [
        '既得安穩的確定性收益',
        '擁抱未知波動的冒險魄力',
        '放不下過去累積的沉沒光環',
        '承受短期陣痛的止損決心',
        '反覆精算最佳時機的猶豫'
      ],
      'E': [
        '填補內心空虛的忙碌慣性',
        '接納生命無常的鬆弛從容',
        '彌補未竟之志的執念焦慮',
        '活在當下真實體驗的純粹',
        '留給身邊人的微光印記'
      ]
    };

    function selectTop(el, name) {
      document.querySelectorAll('#row-top .choice-card').forEach(c => c.classList.remove('selected'));
      selectedTopCard = (selectedTopCard === name) ? null : name;
      if (selectedTopCard) el.classList.add('selected');
      document.getElementById('btn-start-story').disabled = !(selectedTopCard && selectedBottomCard);
    }

    function selectBottom(el, name) {
      document.querySelectorAll('#row-bottom .choice-card').forEach(c => c.classList.remove('selected'));
      selectedBottomCard = (selectedBottomCard === name) ? null : name;
      if (selectedBottomCard) el.classList.add('selected');
      document.getElementById('btn-start-story').disabled = !(selectedTopCard && selectedBottomCard);
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function goToStoryScreen() {
      document.getElementById('display-top-card').innerText = selectedTopCard;
      document.getElementById('display-bottom-card').innerText = selectedBottomCard;
      showScreen('screen-step2');
    }

    function goToTradeoffScreen() {
      renderPool();
      renderStaging();
      showScreen('screen-step3');
    }

    function switchCategory(catKey, tabEl) {
      currentCategory = catKey;
      document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
      tabEl.classList.add('active');
      renderPool();
    }

    function renderPool() {
      const container = document.getElementById('pool-container');
      container.innerHTML = '';
      const cards = cardDatabase[currentCategory];

      cards.forEach(cardText => {
        const isStaged = stagedItems.some(item => item.text === cardText);
        const div = document.createElement('div');
        div.className = 'pool-card' + (isStaged ? ' staged' : '');
        div.innerHTML = `
          <span>${cardText}</span>
          <span class="action-tag">${isStaged ? '已入盤' : '＋加入'}</span>
        `;
        div.onclick = () => toggleStageItem(cardText);
        container.appendChild(div);
      });
    }

    function toggleStageItem(cardText) {
      const index = stagedItems.findIndex(item => item.text === cardText);
      if (index > -1) {
        stagedItems.splice(index, 1);
      } else {
        if (stagedItems.length >= 6) {
          alert('候選盤上限 6 張，請直接點擊下方卡片做二留一捨。');
          return;
        }
        stagedItems.push({ text: cardText, state: 'staged' });
      }
      renderPool();
      renderStaging();
    }

    function renderStaging() {
      const container = document.getElementById('staging-container');
      const counter = document.getElementById('staging-counter');
      counter.innerText = `${stagedItems.length} / 4-6 張`;

      if (stagedItems.length === 0) {
        container.innerHTML = `
          <div style="font-size:0.74rem; color:var(--text-muted); padding:4px;">
            由上方挑選 4–6 張有共鳴的牌放入
          </div>
        `;
        checkConfirmBtn();
        return;
      }

      container.innerHTML = '';
      stagedItems.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'chip-item ' + (item.state !== 'staged' ? item.state : '');
        
        let badge = '候選';
        if (item.state === 'keep') badge = '留';
        if (item.state === 'discard') badge = '捨';

        div.innerHTML = `
          <span>${item.text}</span>
          <span class="chip-badge">${badge}</span>
        `;
        div.onclick = () => cycleDecision(idx);
        container.appendChild(div);
      });

      checkConfirmBtn();
    }

    function cycleDecision(index) {
      const current = stagedItems[index].state;
      const keepCount = stagedItems.filter(i => i.state === 'keep').length;
      const discardCount = stagedItems.filter(i => i.state === 'discard').length;

      if (current === 'staged') {
        if (keepCount < 2) stagedItems[index].state = 'keep';
        else if (discardCount < 1) stagedItems[index].state = 'discard';
        else stagedItems[index].state = 'staged';
      } else if (current === 'keep') {
        if (discardCount < 1) stagedItems[index].state = 'discard';
        else stagedItems[index].state = 'staged';
      } else if (current === 'discard') {
        stagedItems[index].state = 'staged';
      }

      renderStaging();
    }

    function checkConfirmBtn() {
      const btn = document.getElementById('btn-confirm-tradeoff');
      const keepCount = stagedItems.filter(i => i.state === 'keep').length;
      const discardCount = stagedItems.filter(i => i.state === 'discard').length;
      const countValid = (stagedItems.length >= 4 && stagedItems.length <= 6);
      btn.disabled = !(countValid && keepCount === 2 && discardCount === 1);
    }

    function goToBlessingScreen() {
      const kept = stagedItems.filter(i => i.state === 'keep').map(i => i.text);
      const discarded = stagedItems.find(i => i.state === 'discard').text;

      document.getElementById('summary-keep').innerText = kept.join('、');
      document.getElementById('summary-discard').innerText = discarded;

      document.getElementById('prayer-content').innerHTML = `
        旅途漫長，行囊空間終究有限。<br><br>
        願你親手收進背包的<strong>「${kept[0]}」</strong>與<strong>「${kept[1]}」</strong>，<br>
        化為你跨越當前時區、踏實前行的底氣；<br><br>
        願你今天決心留在這張桌上的<strong>「${discarded}」</strong>，<br>
        成為不再回頭的止損點，不再綁架明天清晨醒來的時鐘。
      `;

      showScreen('screen-step4');
    }

    function resetFlow() {
      selectedTopCard = null;
      selectedBottomCard = null;
      stagedItems = [];
      document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-start-story').disabled = true;
      showScreen('screen-step1');
    }
  </script>
</body>
</html>
