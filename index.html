<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>局內人圖鑑｜生命坐標與行囊交割儀</title>
  <style>
    :root {
      --bg-color: #F7F5F0;
      --card-bg: #FFFFFF;
      --card-border: #E5E0D8;
      --text-main: #2A2A2A;
      --text-muted: #7A756D;
      --accent: #B85D43;
      --accent-soft: #F4EBE7;
      --discard-color: #7D7571;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Serif TC", "Microsoft JhengHei", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .screen {
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      width: 100%;
    }

    .screen.active {
      display: block;
      opacity: 1;
    }

    /* 頂部標籤與標題 */
    .header-tag {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .header-title {
      font-size: 1.35rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-main);
      margin-bottom: 24px;
      letter-spacing: 0.04em;
    }

    /* 第一階段：上下分組與卡片佈局 */
    .section-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .choice-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 18px 8px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      line-height: 1.3;
    }

    .choice-card.selected {
      border-color: var(--accent);
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(184, 93, 67, 0.12);
    }

    /* 通用按鈕 */
    .btn {
      width: 100%;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 30px;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(184, 93, 67, 0.25);
      margin-top: 12px;
    }

    .btn:disabled {
      background: var(--card-border);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    /* 第二階段：大字展示與傾聽專注頁 */
    .story-focus-wrap {
      text-align: center;
      padding: 30px 12px;
    }

    .story-meta-label {
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .story-big-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .story-card-box {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      padding: 24px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .story-card-type {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .story-card-title {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-main);
    }

    .story-recording-hint {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.8;
    }

    /* 第三階段：五大心理學副卡二留一捨 */
    .tradeoff-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .tradeoff-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 0 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--text-main);
      color: #FFFFFF;
      border-color: var(--text-main);
    }

    .tradeoff-rule-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 16px;
    }

    .tradeoff-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tradeoff-item {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tradeoff-item .tag {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
      background: #F0EDE8;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: 12px;
    }

    .tradeoff-item.keep {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .tradeoff-item.keep .tag {
      background: var(--accent);
      color: #FFFFFF;
    }

    .tradeoff-item.discard {
      border-color: var(--discard-color);
      background: #ECE9E5;
    }
    .tradeoff-item.discard .tag {
      background: var(--discard-color);
      color: #FFFFFF;
    }

    /* 第四階段：制式化祈願收尾 */
    .blessing-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px 24px;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .blessing-title {
      font-size: 1.05rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .summary-block {
      text-align: left;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--card-border);
    }

    .summary-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .prayer-container {
      margin-top: 24px;
      padding-top: 8px;
    }

    .prayer-text {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--accent);
      line-height: 1.9;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 第一階段：嚴格上下分流各選一 -->
    <div id="screen-step1" class="screen active">
      <div class="header-tag">生命坐標・序幕</div>
      <div class="header-title">請閉上眼，在上下兩組中各翻開一張牌</div>

      <!-- 上排：時空維度 (3選1) -->
      <div class="section-label">✦ 橫軸：時空維度（擇一）</div>
      <div class="card-row" id="row-top">
        <div class="choice-card" onclick="selectTop(this, '過去')">過去</div>
        <div class="choice-card" onclick="selectTop(this, '現在')">現在</div>
        <div class="choice-card" onclick="selectTop(this, '未來')">未來</div>
      </div>

      <!-- 下排：焦點試煉 (3選1) -->
      <div class="section-label">✦ 縱軸：心性試煉（擇一）</div>
      <div class="card-row" id="row-bottom">
        <div class="choice-card" onclick="selectBottom(this, '最滿意的事')">最滿意的事</div>
        <div class="choice-card" onclick="selectBottom(this, '最大的困難')">最大的困難</div>
        <div class="choice-card" onclick="selectBottom(this, '最想做的事')">最想做的事</div>
      </div>

      <button id="btn-start-story" class="btn" disabled onclick="goToStoryScreen()">開牌・故事開始</button>
    </div>

    <!-- 第二階段：大字展示與專注傾聽 -->
    <div id="screen-step2" class="screen">
      <div class="story-focus-wrap">
        <div class="story-meta-label">✦ 故事開始・傾聽中 ✦</div>
        
        <div class="story-big-cards">
          <div class="story-card-box">
            <div class="story-card-type">當前的時空時區</div>
            <div class="story-card-title" id="display-top-card">——</div>
          </div>
          <div class="story-card-box">
            <div class="story-card-type">核心試煉坐標</div>
            <div class="story-card-title" id="display-bottom-card">——</div>
          </div>
        </div>

        <div class="story-recording-hint">
          （ 此刻已開啟獨立錄音 ）<br>
          請像朋友在路邊喝茶般，不帶預設立場地專注傾聽
        </div>

        <button class="btn" onclick="goToTradeoffScreen()">故事結束・整理行囊</button>
      </div>
    </div>

    <!-- 第三階段：五大心理學副卡二留一捨 -->
    <div id="screen-step3" class="screen">
      <div class="header-tag">尾聲交割・生存斷捨離</div>
      <div class="header-title">行囊有限：選 2 樣帶走，丟 1 樣在原地</div>

      <!-- 五大普適心理學套組切換選單 -->
      <div class="tradeoff-tabs">
        <button class="tab-btn active" onclick="switchSet('A', this)">自主與動機</button>
        <button class="tab-btn" onclick="switchSet('B', this)">面具與防衛</button>
        <button class="tab-btn" onclick="switchSet('C', this)">邊界與課題</button>
        <button class="tab-btn" onclick="switchSet('D', this)">損失與權衡</button>
        <button class="tab-btn" onclick="switchSet('E', this)">存在與意義</button>
      </div>

      <div class="tradeoff-rule-hint">
        點擊第 1、2 次為「帶走 (留)」，第 3 次為「丟在原地 (捨)」
      </div>

      <div class="tradeoff-list" id="tradeoff-list-container">
        <!-- JS 動態生成 5 張牌 -->
      </div>

      <button id="btn-confirm-tradeoff" class="btn" disabled onclick="goToBlessingScreen()">確認行囊・交付祝福</button>
    </div>

    <!-- 第四階段：制式化客觀祈願收尾 -->
    <div id="screen-step4" class="screen">
      <div class="header-tag">前行・微光銘記</div>
      
      <div class="blessing-box">
        <div class="blessing-title">✦ 人生行囊交割完成 ✦</div>

        <div class="summary-block">
          <div class="summary-label">裝進背包帶走的底牌（留）：</div>
          <div class="summary-value" id="summary-keep">——</div>
        </div>

        <div class="summary-block">
          <div class="summary-label">親手留在桌上的包袱（捨）：</div>
          <div class="summary-value" style="color: var(--discard-color);" id="summary-discard">——</div>
        </div>

        <div class="prayer-container">
          <div class="prayer-text" id="prayer-content">
            <!-- 純客觀制式化禱詞 -->
          </div>
        </div>
      </div>

      <button class="btn" onclick="resetFlow()">完成訪談・開始新旅程</button>
    </div>

  </div>

  <script>
    // 狀態管理
    let selectedTopCard = null;
    let selectedBottomCard = null;
    let currentSetKey = 'A';
    let keptCards = [];
    let discardedCard = null;

    // 基於五大心理學架構的普適副卡資料庫 (完全抽離特定個案)
    const universalPsychSets = {
      'A': [ // 自我決定論 (Deci & Ryan)
        '掌控生活節奏的自主權',
        '證明自身價值的勝任感',
        '被群體接納的安全歸屬',
        '滿足外界期待的責任包袱',
        '不敢落後同儕的競爭焦慮'
      ],
      'B': [ // 榮格面具與防衛 (Carl Jung)
        '滴水不漏的體面面具',
        '害怕受傷害的防禦疏離',
        '承認脆弱與不完美的勇氣',
        '討好順從的習慣性妥協',
        '不背負承諾的退場自由'
      ],
      'C': [ // 阿德勒課題分離 (Alfred Adler)
        '不怕被否定的被討厭勇氣',
        '渴望所有人認同的證明欲',
        '扛下身邊人情緒的過度介入',
        '劃清界限的平靜冷酷',
        '凡事只能靠自己的假性自立'
      ],
      'D': [ // 康納曼展望理論 (Kahneman & Tversky)
        '既得安穩的確定性收益',
        '擁抱未知波動的冒險魄力',
        '放不下過去累積的沉沒光環',
        '承受短期陣痛的止損決心',
        '反覆精算最佳時機的猶豫'
      ],
      'E': [ // 意義治療與存在主義 (Viktor Frankl)
        '填補內心空虛的忙碌慣性',
        '接納生命無常的鬆弛從容',
        '彌補未竟之志的執念焦慮',
        '活在當下真實體驗的純粹',
        '留給身邊人的微光印記'
      ]
    };

    // 第一階段：嚴格上下各選一控制
    function selectTop(element, cardName) {
      document.querySelectorAll('#row-top .choice-card').forEach(c => c.classList.remove('selected'));
      if (selectedTopCard === cardName) {
        selectedTopCard = null;
      } else {
        element.classList.add('selected');
        selectedTopCard = cardName;
      }
      checkStage1Validity();
    }

    function selectBottom(element, cardName) {
      document.querySelectorAll('#row-bottom .choice-card').forEach(c => c.classList.remove('selected'));
      if (selectedBottomCard === cardName) {
        selectedBottomCard = null;
      } else {
        element.classList.add('selected');
        selectedBottomCard = cardName;
      }
      checkStage1Validity();
    }

    function checkStage1Validity() {
      const btn = document.getElementById('btn-start-story');
      btn.disabled = !(selectedTopCard !== null && selectedBottomCard !== null);
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      window.scrollTo(0, 0);
    }

    // 第二階段：大字展示
    function goToStoryScreen() {
      document.getElementById('display-top-card').innerText = selectedTopCard;
      document.getElementById('display-bottom-card').innerText = selectedBottomCard;
      showScreen('screen-step2');
    }

    // 第三階段：五大套組切換與渲染
    function goToTradeoffScreen() {
      renderTradeoffCards();
      showScreen('screen-step3');
    }

    function switchSet(key, btn) {
      currentSetKey = key;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      keptCards = [];
      discardedCard = null;
      renderTradeoffCards();
      updateTradeoffBtn();
    }

    function renderTradeoffCards() {
      const container = document.getElementById('tradeoff-list-container');
      container.innerHTML = '';
      const cards = universalPsychSets[currentSetKey];

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'tradeoff-item';
        div.onclick = () => handleTradeoffClick(card);

        let tagText = '點擊選擇';
        if (keptCards.includes(card)) {
          div.classList.add('keep');
          tagText = '帶走 (留)';
        } else if (discardedCard === card) {
          div.classList.add('discard');
          tagText = '丟在原地 (捨)';
        }

        div.innerHTML = `
          <span>${card}</span>
          <span class="tag">${tagText}</span>
        `;
        container.appendChild(div);
      });
    }

    // 二留一捨狀態循環處理：未選 -> 留 (上限2) -> 捨 (上限1) -> 取消
    function handleTradeoffClick(card) {
      if (keptCards.includes(card)) {
        keptCards = keptCards.filter(c => c !== card);
        if (!discardedCard) {
          discardedCard = card;
        }
      } else if (discardedCard === card) {
        discardedCard = null;
      } else {
        if (keptCards.length < 2) {
          keptCards.push(card);
        } else if (!discardedCard) {
          discardedCard = card;
        }
      }
      renderTradeoffCards();
      updateTradeoffBtn();
    }

    function updateTradeoffBtn() {
      const btn = document.getElementById('btn-confirm-tradeoff');
      btn.disabled = !(keptCards.length === 2 && discardedCard !== null);
    }

    // 第四階段：純制式化客觀祈願收尾 (去個案化、客觀莊嚴)
    function goToBlessingScreen() {
      document.getElementById('summary-keep').innerText = keptCards.join('、');
      document.getElementById('summary-discard').innerText = discardedCard;

      const prayerElem = document.getElementById('prayer-content');
      prayerElem.innerHTML = `
        旅途漫長，行囊空間終究有限。<br><br>
        願你此刻親手收進背包的<strong>「${keptCards[0]}」</strong>與<strong>「${keptCards[1]}」</strong>，<br>
        化為你跨越當前時區、踏實前行的底氣；<br><br>
        願你今天決心留在這張桌上的<strong>「${discardedCard}」</strong>，<br>
        成為不再回頭的止損點，不再綁架明天清晨醒來的時鐘。
      `;

      showScreen('screen-step4');
    }

    // 重置所有流程
    function resetFlow() {
      selectedTopCard = null;
      selectedBottomCard = null;
      keptCards = [];
      discardedCard = null;
      document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('btn-start-story').disabled = true;
      showScreen('screen-step1');
    }
  </script>
</body>
</html>
