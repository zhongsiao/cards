<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六選二 微型觀察家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        body { background-color: #Fdfbf7; font-family: 'Noto Serif TC', serif; color: #2c3e50; }
        .card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; background: #fff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .card.selected { border-color: #d4a373; background-color: #faedcd; transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 25px -5px rgba(212, 163, 115, 0.3); }
        .card:hover:not(.selected) { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        #stage2, #stage3 { display: none; }
        .recording-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .btn-primary { background: linear-gradient(135deg, #d4a373 0%, #ccd5ae 100%); color: #2c3e50; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #d4a373; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

<audio id="click-sound" src="https://actions.google.com/sounds/v1/ui/button_click.ogg" preload="auto"></audio>

<button onclick="setApiKey()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
    <i class="fas fa-cog text-2xl"></i>
</button>

<!-- 階段 1 -->
<div id="stage1" class="w-full max-w-4xl text-center fade-in mt-8">
    <div class="mb-12">
        <h1 class="text-3xl md:text-5xl font-bold mb-4 tracking-wider text-gray-800">微型觀察紀錄</h1>
        <p class="text-gray-500 text-lg md:text-xl font-light">「請憑直覺，選出兩張最能代表你此刻心情的卡牌。」</p>
    </div>
    <div id="card-container" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8 mb-12">
        <div class="card border-2 border-transparent rounded-2xl p-8 flex items-center justify-center h-32 md:h-48" data-name="過去"><h2 class="text-2xl md:text-3xl font-bold text-gray-700 tracking-widest">過去</h2></div>
        <div class="card border-2 border-transparent rounded-2xl p-8 flex items-center justify-center h-32 md:h-48" data-name="現在"><h2 class="text-2xl md:text-3xl font-bold text-gray-700 tracking-widest">現在</h2></div>
        <div class="card border-2 border-transparent rounded-2xl p-8 flex items-center justify-center h-32 md:h-48" data-name="未來"><h2 class="text-2xl md:text-3xl font-bold text-gray-700 tracking-widest">未來</h2></div>
        <div class="card border-2 border-transparent rounded-2xl p-8 flex items-center justify-center h-32 md:h-48" data-name="最滿意"><h2 class="text-xl md:text-2xl font-bold text-gray-700 tracking-wider">最滿意的事</h2></div>
        <div class="card border-2 border-transparent rounded-2xl p-8 flex items-center justify-center h-32 md:h-48" data-name="最困難"><h2 class="text-xl md:text-2xl font-bold text-gray-700 tracking-wider">最大的困難</h2></div>
        <div class="card border-2 border-transparent rounded-2xl p-8 flex items-center justify-center h-32 md:h-48" data-name="最想做"><h2 class="text-xl md:text-2xl font-bold text-gray-700 tracking-wider">最想做的事</h2></div>
    </div>
    <button id="btn-start" class="hidden mx-auto btn-primary px-12 py-4 rounded-full text-xl font-bold shadow-lg transition transform hover:-translate-y-1 hover:shadow-xl">開啟對話 <i class="fas fa-arrow-right ml-2"></i></button>
</div>

<!-- 階段 2 -->
<div id="stage2" class="w-full max-w-3xl text-center fade-in">
    <div class="flex items-center justify-center gap-3 mb-8">
        <div class="w-3 h-3 bg-red-500 rounded-full recording-pulse" id="recording-indicator"></div>
        <h2 class="text-2xl font-bold text-gray-700 tracking-widest">聆聽中...</h2>
    </div>
    <div id="active-cards" class="flex justify-center gap-4 md:gap-8 mb-8"></div>
    <div class="flex flex-col items-center justify-center mb-10">
        <div class="text-6xl md:text-7xl font-sans text-gray-800 mb-6 tracking-widest" id="timer" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 200;">00:00</div>
        <div class="flex gap-4">
            <button id="btn-pause" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-full font-semibold transition"><i class="fas fa-pause mr-2"></i>暫停</button>
            <button id="btn-end" class="bg-gray-800 hover:bg-black text-white px-8 py-3 rounded-full font-semibold shadow-lg transition"><i class="fas fa-magic mr-2"></i>結束並呼叫 AI 萃取</button>
        </div>
    </div>
    <div class="relative max-w-2xl mx-auto">
        <div class="bg-white/50 backdrop-blur-sm p-6 rounded-2xl text-left h-32 overflow-y-auto border border-gray-100 text-gray-500 text-base leading-relaxed opacity-70 hover:opacity-100 transition-opacity" id="transcript">
            (開始收音...)
        </div>
    </div>
</div>

<!-- 階段 3 -->
<div id="stage3" class="w-full max-w-2xl text-center fade-in pb-12">
    <h2 class="text-3xl font-bold mb-8 text-gray-800 tracking-widest">微型觀察：故事紀錄</h2>
    
    <div id="ai-loading" class="bg-white rounded-3xl shadow-xl p-12 mb-10 flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-gray-600 font-bold tracking-widest">AI (Pro 最新版) 正在深度解析與萃取故事...</p>
    </div>

    <div id="ai-result" class="hidden bg-white rounded-3xl shadow-2xl overflow-hidden mb-10 border border-gray-100 text-left">
        <div class="w-full h-48 relative flex items-center justify-center overflow-hidden bg-[#e9ecef]">
            <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Generated Artwork" class="w-full h-full object-cover mix-blend-multiply opacity-90">
            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
            <div class="absolute bottom-6 left-6 text-white">
                <div class="flex gap-2 mb-2">
                    <span class="bg-white/20 backdrop-blur-md border border-white/30 px-4 py-1.5 rounded-full text-sm font-semibold tracking-widest" id="tag1">標籤 1</span>
                    <span class="bg-white/20 backdrop-blur-md border border-white/30 px-4 py-1.5 rounded-full text-sm font-semibold tracking-widest" id="tag2">標籤 2</span>
                </div>
            </div>
        </div>
        <div class="p-8">
            <div class="mb-6 relative">
                <i class="fas fa-quote-left text-3xl text-gray-200 absolute -top-4 -left-2"></i>
                <p class="text-xl text-gray-800 leading-loose font-bold relative z-10 pl-6 mb-4" id="ai-quote"></p>
                <p class="text-gray-600 text-base leading-relaxed pl-6 mb-6" id="ai-summary"></p>
            </div>
            
            <div class="bg-[#faedcd] border-l-4 border-[#d4a373] p-5 rounded-r-lg mt-4">
                <p class="text-sm font-bold text-gray-800 mb-2"><i class="fas fa-lightbulb text-yellow-600 mr-2"></i>微型觀察家建議：</p>
                <p class="text-base text-gray-700 leading-relaxed font-medium" id="ai-suggestion"></p>
            </div>
        </div>
    </div>
    
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button id="btn-download" class="bg-gray-900 text-white px-8 py-4 rounded-full text-lg font-bold shadow-xl hover:bg-black transition inline-flex items-center justify-center gap-3">
            <i class="fas fa-file-download"></i> 下載完整文字紀錄
        </button>
        <button onclick="location.reload()" class="bg-white border-2 border-gray-200 text-gray-600 px-8 py-4 rounded-full text-lg font-bold shadow-sm hover:bg-gray-50 transition inline-flex items-center justify-center gap-3">
            <i class="fas fa-redo"></i> 展開新訪談
        </button>
    </div>
</div>
            <!-- 微型觀察家建議區塊的結尾 -->
            <div class="bg-[#faedcd] border-l-4 border-[#d4a373] p-5 rounded-r-lg mt-4">
                <p class="text-sm font-bold text-gray-800 mb-2"><i class="fas fa-lightbulb text-yellow-600 mr-2"></i>微型觀察家建議：</p>
                <p class="text-base text-gray-700 leading-relaxed font-medium" id="ai-suggestion"></p>
            </div>
            
            <!-- ▼▼▼ 請將以下這段貼在這裡 ▼▼▼ -->
            <div class="mt-8 bg-white border border-gray-100 p-4 rounded-2xl shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center shadow-inner">
                        <i class="fas fa-music text-[#d4a373] text-lg"></i>
                    </div>
                    <div class="text-left">
                        <p class="text-sm font-bold text-gray-800 tracking-wider">歲月裡的微光</p>
                        <p class="text-xs text-gray-500">專屬故事配樂</p>
                    </div>
                </div>
                <audio id="story-bgm" controls class="h-10 w-40 md:w-48 outline-none">
                    <source src="bgm.mp3" type="audio/mpeg">
                </audio>
            </div>
            <!-- ▲▲▲ 貼上這段 ▲▲▲ -->
<script>
    function setApiKey() {
        let currentKey = localStorage.getItem('gemini_api_key') || '';
        let newKey = prompt("設定/更新 Google Gemini API Key：", currentKey);
        if (newKey !== null && newKey.trim() !== '') {
            localStorage.setItem('gemini_api_key', newKey.trim());
            alert("API Key 儲存成功！");
        }
    }

    const clickSound = document.getElementById('click-sound');
    let selectedCards = [];
    let startTime, timerInterval, pausedTime = 0, isPaused = false, isEnded = false;
    let finalTranscript = "";
    
    const cards = document.querySelectorAll('.card');
    const btnStart = document.getElementById('btn-start');
    
    cards.forEach(card => {
        card.addEventListener('click', () => {
            clickSound.currentTime = 0; clickSound.play().catch(e=>{});
            if (selectedCards.includes(card)) {
                card.classList.remove('selected');
                selectedCards = selectedCards.filter(c => c !== card);
            } else if (selectedCards.length < 2) {
                card.classList.add('selected');
                selectedCards.push(card);
            }
            if (selectedCards.length === 2) {
                btnStart.classList.remove('hidden');
                cards.forEach(c => { if (!selectedCards.includes(c)) { c.style.opacity = '0.3'; } });
            } else {
                btnStart.classList.add('hidden');
                cards.forEach(c => { c.style.opacity = '1'; });
            }
        });
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'zh-TW';
        
        recognition.onresult = (e) => {
            let interim = '';
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                let text = e.results[i][0].transcript.trim();
                if(text && !text.match(/^[，。、 ]+$/)) {
                    if (e.results[i].isFinal) finalTranscript += text + "，";
                    else interim += text;
                }
            }
            let displayTranscript = finalTranscript.replace(/[，]+/g, '，');
            document.getElementById('transcript').innerHTML = displayTranscript + '<span class="text-gray-400">' + interim + '</span>';
        };

        recognition.onend = () => {
            if (!isPaused && !isEnded) { try { recognition.start(); } catch(e) {} }
        };
    }

    function updateTimer() {
        const diff = Date.now() - startTime + pausedTime;
        const m = Math.floor(diff / 60000).toString().padStart(2, '0');
        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        document.getElementById('timer').textContent = `${m}:${s}`;
    }

    btnStart.addEventListener('click', () => {
        let apiKey = localStorage.getItem('gemini_api_key');
        if(!apiKey) {
            alert("請先點擊右上角齒輪設定 Gemini API Key！");
            setApiKey();
            if(!localStorage.getItem('gemini_api_key')) return;
        }

        document.getElementById('stage1').style.display = 'none';
        document.getElementById('stage2').style.display = 'block';
        const activeContainer = document.getElementById('active-cards');
        selectedCards.forEach(card => {
            const clone = card.cloneNode(true);
            clone.className = 'border-2 border-[#d4a373] rounded-2xl p-4 bg-white flex items-center justify-center w-32 h-24 shadow-md';
            clone.querySelector('h2').className = 'text-lg font-bold text-gray-700 tracking-wider';
            activeContainer.appendChild(clone);
        });
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
        if (recognition) recognition.start();
    });

    const btnPause = document.getElementById('btn-pause');
    btnPause.addEventListener('click', () => {
        if (!isPaused) {
            clearInterval(timerInterval);
            pausedTime += Date.now() - startTime;
            isPaused = true;
            if (recognition) recognition.stop();
            document.getElementById('recording-indicator').classList.remove('recording-pulse');
            document.getElementById('recording-indicator').classList.replace('bg-red-500', 'bg-gray-400');
            btnPause.innerHTML = '<i class="fas fa-play mr-2"></i>繼續';
        } else {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            isPaused = false;
            if (recognition) recognition.start();
            document.getElementById('recording-indicator').classList.add('recording-pulse');
            document.getElementById('recording-indicator').classList.replace('bg-gray-400', 'bg-red-500');
            btnPause.innerHTML = '<i class="fas fa-pause mr-2"></i>暫停';
        }
    });

    document.getElementById('btn-end').addEventListener('click', async () => {
        clearInterval(timerInterval);
        isEnded = true;
        if (recognition) recognition.stop();
        
        document.getElementById('stage2').style.display = 'none';
        document.getElementById('stage3').style.display = 'block';
        
        let card1 = selectedCards[0].dataset.name;
        let card2 = selectedCards[1].dataset.name;
        document.getElementById('tag1').textContent = card1;
        document.getElementById('tag2').textContent = card2;

        let cleanText = finalTranscript.replace(/[，]+/g, '，');
        if(cleanText.length < 10) {
            document.getElementById('ai-loading').style.display = 'none';
            document.getElementById('ai-result').classList.remove('hidden');
            document.getElementById('ai-result').style.display = 'block';
            document.getElementById('ai-quote').textContent = "未能擷取到足夠對話";
            document.getElementById('ai-summary').textContent = "語音辨識未收到足夠內容。";
            return;
        }

        let apiKey = localStorage.getItem('gemini_api_key');
        let promptText = `你現在是一位充滿人文關懷的微型觀察家。根據以下訪談逐字稿（受訪者抽到的卡牌主題是：「${card1}」與「${card2}」），請幫我萃取並回傳，必須包含三個欄位：
1. "quote"：一句最具代表性、充滿溫度的金句 (不超過25字)。
2. "summary"：故事摘要與核心困境 (約100字)。
3. "suggestion"：以旁觀者角度，給予我(訪談者)一個具體建議，告訴我可以如何在事業或心靈上給予他一點幫助 (約50-80字)。

逐字稿如下：${cleanText}`;

        try {
            // 已更新：改用 gemini-1.5-pro-latest 確保支援度與品質
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: { responseMimeType: "application/json" } 
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `HTTP 錯誤碼: ${response.status}`);
            }

            const data = await response.json();
            let resultText = data.candidates[0].content.parts[0].text;
            const aiData = JSON.parse(resultText);

            document.getElementById('ai-quote').textContent = "「" + aiData.quote + "」";
            document.getElementById('ai-summary').textContent = aiData.summary;
            document.getElementById('ai-suggestion').textContent = aiData.suggestion;

        } catch (error) {
            console.error(error);
            document.getElementById('ai-quote').textContent = "AI 萃取失敗";
            document.getElementById('ai-summary').innerHTML = `<span class="text-red-500 font-bold">錯誤原因：</span><br>${error.message}`;
            document.getElementById('ai-suggestion').textContent = "請點選右上角齒輪，確認 API Key 是否複製完整（不可有空白）。若錯誤持續發生，請確認網路連線。";
        } finally {
            document.getElementById('ai-loading').style.display = 'none';
            document.getElementById('ai-result').classList.remove('hidden');
            document.getElementById('ai-result').style.display = 'block';
            try { document.getElementById('story-bgm').play(); } catch(e) {}
        }
    });

    document.getElementById('btn-download').addEventListener('click', () => {
        const now = new Date();
        const y = now.getFullYear(), m = String(now.getMonth() + 1).padStart(2, '0'), d = String(now.getDate()).padStart(2, '0');
        const h = String(now.getHours()).padStart(2, '0'), min = String(now.getMinutes()).padStart(2, '0');
        
        let cleanText = finalTranscript.replace(/[，]+/g, '，');
        let quote = document.getElementById('ai-quote').textContent;
        let summary = document.getElementById('ai-summary').textContent;
        let suggestion = document.getElementById('ai-suggestion').textContent;

        const content = `【微型觀察紀錄】\n時間：${y}/${m}/${d} ${h}:${min}\n抽中卡牌：${selectedCards[0].dataset.name} & ${selectedCards[1].dataset.name}\n\n【金句】\n${quote}\n\n【故事摘要】\n${summary}\n\n【給予幫助之建議】\n${suggestion}\n\n------------------------\n【原始逐字稿】\n${cleanText}`;
        
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `微型觀察_${y}${m}${d}_${h}${min}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    });
</script>
</body>
</html>
